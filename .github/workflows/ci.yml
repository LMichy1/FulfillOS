name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fulfillos
          POSTGRES_PASSWORD: fulfillos
          POSTGRES_DB: fulfillos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fulfillos -d fulfillos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL)
        run: pnpm --filter @fulfillos/api test:integration
        env:
          DATABASE_URL_TEST: postgresql://fulfillos:fulfillos@localhost:5432/fulfillos_test

      - name: Security tests (auth, sessions, CSRF, tenancy)
        run: pnpm --filter @fulfillos/api test:security
        env:
          DATABASE_URL_TEST: postgresql://fulfillos:fulfillos@localhost:5432/fulfillos_test
          REDIS_URL_TEST: redis://localhost:6379/1

      - name: Frontend component tests
        run: pnpm --filter @fulfillos/web test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @fulfillos/web exec playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: pnpm --filter @fulfillos/web test:e2e
        env:
          # Playwright's own webServer starts its API instance pointed at this database (see
          # apps/web/playwright.config.ts) — the same isolated-test-database pattern the Jest
          # integration/security steps above use, not the development database. Its Redis
          # logical database (rate-limit counters) defaults to db 2 inside playwright.config.ts
          # itself and is flushed by e2e/global-setup.ts before every run — no env var needed
          # here, since this job's redis service is already exclusive to this run.
          DATABASE_URL_TEST: postgresql://fulfillos:fulfillos@localhost:5432/fulfillos_test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
