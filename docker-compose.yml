services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fulfillos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fulfillos}
      POSTGRES_DB: ${POSTGRES_DB:-fulfillos}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-fulfillos_test}
      POSTGRES_TEST_USER: ${POSTGRES_TEST_USER:-fulfillos_test}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:-fulfillos_test}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fulfillos} -d ${POSTGRES_DB:-fulfillos}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
